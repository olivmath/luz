<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a1a"/>
      <stop offset="100%" stop-color="#062010"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#062010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Cross / health symbol -->
  <g transform="translate(200, 100)" opacity="0.3">
    <rect x="-8" y="-25" width="16" height="50" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
    <rect x="-25" y="-8" width="50" height="16" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- Blockchain chain links -->
  <g transform="translate(80, 200)" opacity="0.25">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="#10b981" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/>
    <text x="30" y="19" font-family="monospace" font-size="8" fill="#34d399" fill-opacity="0.6" text-anchor="middle">BLOCK</text>
    <line x1="60" y1="15" x2="80" y2="15" stroke="#34d399" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="80" y="0" width="60" height="30" rx="5" fill="#10b981" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="19" font-family="monospace" font-size="8" fill="#34d399" fill-opacity="0.6" text-anchor="middle">BLOCK</text>
    <line x1="140" y1="15" x2="160" y2="15" stroke="#34d399" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="160" y="0" width="60" height="30" rx="5" fill="#10b981" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/>
    <text x="190" y="19" font-family="monospace" font-size="8" fill="#34d399" fill-opacity="0.6" text-anchor="middle">BLOCK</text>
  </g>

  <!-- FHIR resource card -->
  <g transform="translate(50, 60)" opacity="0.2">
    <rect x="0" y="0" width="70" height="45" rx="5" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="35" y="16" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">FHIR</text>
    <line x1="8" y1="24" x2="62" y2="24" stroke="#6ee7b7" stroke-width="0.6"/>
    <line x1="8" y1="32" x2="50" y2="32" stroke="#6ee7b7" stroke-width="0.6"/>
  </g>

  <!-- Shield / LGPD -->
  <g transform="translate(310, 70)" opacity="0.2">
    <path d="M15,0 L30,8 L30,22 Q30,35 15,40 Q0,35 0,22 L0,8Z" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <path d="M10,20 L14,24 L22,16" fill="none" stroke="#34d399" stroke-width="1.5"/>
  </g>

  <!-- SUS network nodes -->
  <g transform="translate(200, 310)" opacity="0.2">
    <circle cx="0" cy="0" r="8" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="-60" cy="-30" r="6" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1"/>
    <circle cx="60" cy="-30" r="6" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1"/>
    <circle cx="-50" cy="35" r="5" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1"/>
    <circle cx="50" cy="35" r="5" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1"/>
    <line x1="0" y1="0" x2="-60" y2="-30" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="0" y1="0" x2="60" y2="-30" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="0" y1="0" x2="-50" y2="35" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="0" y1="0" x2="50" y2="35" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="0" y="60" font-family="monospace" font-size="7" fill="#34d399" fill-opacity="0.5" text-anchor="middle">RNDS</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="30" cy="380" r="1.5" fill="#34d399" fill-opacity="0.1"/>
  <circle cx="350" cy="370" r="3" fill="#10b981" fill-opacity="0.08"/>
</svg>
