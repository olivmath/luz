<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f0520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Person silhouette (identity) -->
  <g transform="translate(200, 120)" opacity="0.3">
    <circle cx="0" cy="-30" r="22" fill="none" stroke="#c084fc" stroke-width="2"/>
    <path d="M-30,10 Q-30,-5 0,-5 Q30,-5 30,10 L30,35 Q30,40 25,40 L-25,40 Q-30,40 -30,35Z" fill="none" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- DID string -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="240" height="30" rx="6" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="120" y="20" font-family="monospace" font-size="11" fill="#c084fc" fill-opacity="0.5" text-anchor="middle">did:example:123abc...</text>
  </g>

  <!-- Triangle of trust -->
  <g transform="translate(200, 300)" opacity="0.2">
    <polygon points="0,-50 -55,30 55,30" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="0" cy="-50" r="6" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-width="1"/>
    <circle cx="-55" cy="30" r="6" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-width="1"/>
    <circle cx="55" cy="30" r="6" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-width="1"/>
    <text x="0" y="-58" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Issuer</text>
    <text x="-55" y="45" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Holder</text>
    <text x="55" y="45" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Verifier</text>
  </g>

  <!-- Credential card -->
  <g transform="translate(50, 60)" opacity="0.2">
    <rect x="0" y="0" width="70" height="45" rx="5" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <line x1="8" y1="14" x2="50" y2="14" stroke="#e9d5ff" stroke-width="0.6"/>
    <line x1="8" y1="22" x2="40" y2="22" stroke="#e9d5ff" stroke-width="0.6"/>
    <circle cx="56" cy="34" r="6" fill="none" stroke="#a855f7" stroke-width="1"/>
    <path d="M53,34 L55,36 L59,32" fill="none" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Key icon -->
  <g transform="translate(310, 80)" opacity="0.2">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#a855f7" fill-opacity="0.1"/>
    <line x1="27" y1="15" x2="55" y2="15" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="45" y1="15" x2="45" y2="22" stroke="#c084fc" stroke-width="1"/>
    <line x1="52" y1="15" x2="52" y2="20" stroke="#c084fc" stroke-width="1"/>
  </g>

  <!-- Network nodes -->
  <g opacity="0.08">
    <circle cx="70" cy="300" r="4" fill="#a855f7"/>
    <circle cx="330" cy="250" r="4" fill="#a855f7"/>
    <circle cx="350" cy="370" r="3" fill="#a855f7"/>
    <circle cx="50" cy="200" r="3" fill="#c084fc"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#a855f7" fill-opacity="0.15"/>
  <circle cx="30" cy="380" r="1.5" fill="#c084fc" fill-opacity="0.1"/>
</svg>
