<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f0520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Elliptic curve large -->
  <g transform="translate(200, 170)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="80" ry="55" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="none" stroke="#a855f7" stroke-width="1"/>
    <!-- Points on curve -->
    <circle cx="-60" cy="20" r="4" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
    <circle cx="40" cy="-35" r="4" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
    <circle cx="70" cy="15" r="4" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
    <!-- Line between points -->
    <line x1="-60" y1="20" x2="40" y2="-35" stroke="#e9d5ff" stroke-width="0.8" stroke-dasharray="4,3"/>
    <line x1="40" y1="-35" x2="70" y2="15" stroke="#e9d5ff" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="0" y="75" font-family="monospace" font-size="8" fill="#c084fc" fill-opacity="0.5" text-anchor="middle">secp256k1</text>
  </g>

  <!-- Key pair -->
  <g transform="translate(50, 50)" opacity="0.25">
    <!-- Public key -->
    <rect x="0" y="0" width="85" height="35" rx="5" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="42" y="15" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Public Key</text>
    <text x="42" y="27" font-family="monospace" font-size="6" fill="#e9d5ff" fill-opacity="0.5" text-anchor="middle">0x04a1b2c3...</text>
  </g>

  <!-- Private key -->
  <g transform="translate(270, 50)" opacity="0.25">
    <rect x="0" y="0" width="85" height="35" rx="5" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <text x="42" y="15" font-family="monospace" font-size="7" fill="#a855f7" text-anchor="middle">Private Key</text>
    <text x="42" y="27" font-family="monospace" font-size="6" fill="#e9d5ff" fill-opacity="0.5" text-anchor="middle">0x7f8e9d...</text>
    <circle cx="75" cy="10" r="5" fill="none" stroke="#a855f7" stroke-width="1"/>
    <rect x="72" y="14" width="6" height="8" rx="1" fill="none" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Hash function -->
  <g transform="translate(140, 280)" opacity="0.2">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#a855f7" fill-opacity="0.05" stroke="#c084fc" stroke-width="1.5"/>
    <text x="60" y="17" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">SHA-256</text>
    <text x="60" y="30" font-family="monospace" font-size="6" fill="#e9d5ff" fill-opacity="0.4" text-anchor="middle">f(x) = H(m)</text>
    <!-- Input arrow -->
    <line x1="-20" y1="20" x2="-2" y2="20" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="-6" y1="16" x2="-2" y2="20" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="-6" y1="24" x2="-2" y2="20" stroke="#e9d5ff" stroke-width="1"/>
    <!-- Output arrow -->
    <line x1="122" y1="20" x2="142" y2="20" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="138" y1="16" x2="142" y2="20" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="138" y1="24" x2="142" y2="20" stroke="#e9d5ff" stroke-width="1"/>
  </g>

  <!-- ZKP circuit -->
  <g transform="translate(50, 310)" opacity="0.15">
    <rect x="0" y="0" width="55" height="55" rx="4" fill="none" stroke="#c084fc" stroke-width="1"/>
    <text x="27" y="20" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">ZK</text>
    <text x="27" y="35" font-family="monospace" font-size="7" fill="#c084fc" fill-opacity="0.6" text-anchor="middle">SNARK</text>
    <circle cx="27" cy="47" r="2" fill="#a855f7" fill-opacity="0.3"/>
  </g>

  <!-- BBS+ signature -->
  <g transform="translate(300, 310)" opacity="0.15">
    <rect x="0" y="0" width="55" height="55" rx="4" fill="none" stroke="#c084fc" stroke-width="1"/>
    <text x="27" y="20" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">BBS+</text>
    <text x="27" y="35" font-family="monospace" font-size="6" fill="#c084fc" fill-opacity="0.6" text-anchor="middle">Selective</text>
    <text x="27" y="45" font-family="monospace" font-size="6" fill="#c084fc" fill-opacity="0.6" text-anchor="middle">Disclosure</text>
  </g>

  <!-- Blockchain nodes -->
  <g opacity="0.08">
    <circle cx="50" cy="200" r="3" fill="#a855f7"/>
    <circle cx="350" cy="200" r="3" fill="#a855f7"/>
    <circle cx="370" cy="380" r="3" fill="#c084fc"/>
    <circle cx="30" cy="380" r="2" fill="#c084fc"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#a855f7" fill-opacity="0.15"/>
  <circle cx="30" cy="30" r="1.5" fill="#c084fc" fill-opacity="0.1"/>
</svg>
