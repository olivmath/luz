<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0f1f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f1f14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Securitization layers (stacked structure) -->
  <g transform="translate(60, 80)" opacity="0.25">
    <rect x="0" y="0" width="160" height="40" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80" y="25" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" opacity="0.7">SENIOR</text>
    <rect x="10" y="50" width="140" height="35" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="80" y="72" font-family="sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" opacity="0.6">MEZANINO</text>
    <rect x="20" y="95" width="120" height="30" rx="4" fill="none" stroke="#d97706" stroke-width="1"/>
    <text x="80" y="114" font-family="sans-serif" font-size="9" fill="#d97706" text-anchor="middle" opacity="0.5">SUBORDINADA</text>
  </g>

  <!-- Waterfall arrows -->
  <g stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1" fill="none">
    <line x1="140" y1="125" x2="140" y2="140"/>
    <line x1="135" y1="135" x2="140" y2="140"/>
    <line x1="145" y1="135" x2="140" y2="140"/>
    <line x1="140" y1="180" x2="140" y2="195"/>
    <line x1="135" y1="190" x2="140" y2="195"/>
    <line x1="145" y1="190" x2="140" y2="195"/>
  </g>

  <!-- CPR document icon -->
  <g transform="translate(280, 60)" opacity="0.18" fill="#86efac">
    <rect x="0" y="0" width="60" height="80" rx="4" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <line x1="12" y1="20" x2="48" y2="20" stroke="#86efac" stroke-width="1"/>
    <line x1="12" y1="32" x2="48" y2="32" stroke="#86efac" stroke-width="1"/>
    <line x1="12" y1="44" x2="36" y2="44" stroke="#86efac" stroke-width="1"/>
    <text x="30" y="68" font-family="sans-serif" font-size="10" fill="#86efac" text-anchor="middle">CPR</text>
  </g>

  <!-- Risk gauge -->
  <g transform="translate(290, 200)" opacity="0.15">
    <path d="M0,50 A50,50 0 0,1 100,50" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M10,50 A40,40 0 0,1 40,15" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <path d="M40,15 A40,40 0 0,1 70,10" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M70,10 A40,40 0 0,1 90,50" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="50" y1="50" x2="35" y2="20" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- FIAGRO icon -->
  <g transform="translate(50, 260)" opacity="0.15" fill="#86efac">
    <rect x="0" y="15" width="70" height="50" rx="6" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="46" font-family="sans-serif" font-size="10" fill="#86efac" text-anchor="middle">FIAGRO</text>
    <circle cx="35" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <text x="35" y="4" font-family="sans-serif" font-size="8" fill="#fbbf24" text-anchor="middle">$</text>
  </g>

  <!-- Globe icon (international) -->
  <circle cx="320" cy="330" r="25" fill="none" stroke="#86efac" stroke-width="1" stroke-opacity="0.12"/>
  <ellipse cx="320" cy="330" rx="12" ry="25" fill="none" stroke="#86efac" stroke-width="0.8" stroke-opacity="0.1"/>
  <line x1="295" y1="330" x2="345" y2="330" stroke="#86efac" stroke-width="0.8" stroke-opacity="0.1"/>

  <!-- Cross-border flow lines -->
  <g stroke="#4ade80" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M200,350 Q250,320 300,340 T380,300"/>
    <path d="M220,370 Q270,340 320,360 T400,320"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="40" r="2" fill="#fbbf24" fill-opacity="0.12"/>
  <circle cx="370" cy="380" r="2.5" fill="#86efac" fill-opacity="0.1"/>
  <circle cx="250" cy="280" r="2" fill="#fbbf24" fill-opacity="0.08"/>
</svg>