<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Grid lines (financial) -->
  <g stroke="#4ade80" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Rising chart line -->
  <polyline points="40,340 80,310 120,320 160,280 200,260 240,220 280,180 320,140 360,90"
    fill="none" stroke="#4ade80" stroke-width="2.5" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area under chart -->
  <polygon points="40,340 80,310 120,320 160,280 200,260 240,220 280,180 320,140 360,90 360,400 40,400"
    fill="#4ade80" fill-opacity="0.06"/>

  <!-- Wheat stalk center -->
  <g transform="translate(200, 60)" opacity="0.2" fill="#86efac">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#86efac" stroke-width="2"/>
    <ellipse cx="-8" cy="15" rx="5" ry="14" transform="rotate(-25,-8,15)"/>
    <ellipse cx="8" cy="30" rx="5" ry="14" transform="rotate(25,8,30)"/>
    <ellipse cx="-8" cy="50" rx="5" ry="14" transform="rotate(-25,-8,50)"/>
    <ellipse cx="8" cy="65" rx="5" ry="14" transform="rotate(25,8,65)"/>
    <ellipse cx="-8" cy="85" rx="5" ry="13" transform="rotate(-25,-8,85)"/>
    <ellipse cx="8" cy="100" rx="5" ry="13" transform="rotate(25,8,100)"/>
  </g>

  <!-- Wheat stalk left -->
  <g transform="translate(100, 100) rotate(-10)" opacity="0.12" fill="#86efac">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#86efac" stroke-width="1.5"/>
    <ellipse cx="-7" cy="15" rx="4" ry="12" transform="rotate(-22,-7,15)"/>
    <ellipse cx="7" cy="30" rx="4" ry="12" transform="rotate(22,7,30)"/>
    <ellipse cx="-7" cy="50" rx="4" ry="12" transform="rotate(-22,-7,50)"/>
    <ellipse cx="7" cy="65" rx="4" ry="12" transform="rotate(22,7,65)"/>
  </g>

  <!-- Coin circles -->
  <circle cx="300" cy="120" r="28" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="300" y="126" font-family="serif" font-size="18" fill="#fbbf24" fill-opacity="0.2" text-anchor="middle">R$</text>

  <circle cx="330" cy="180" r="20" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.12"/>
  <text x="330" y="185" font-family="serif" font-size="12" fill="#fbbf24" fill-opacity="0.12" text-anchor="middle">R$</text>

  <!-- Building icon (institutional) -->
  <g transform="translate(60, 280)" opacity="0.1" fill="#86efac">
    <rect x="0" y="20" width="50" height="40"/>
    <polygon points="25,-5 -5,20 55,20"/>
    <rect x="8" y="30" width="10" height="12" fill="#14532d"/>
    <rect x="32" y="30" width="10" height="12" fill="#14532d"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="50" cy="60" r="2" fill="#86efac" fill-opacity="0.15"/>
  <circle cx="340" cy="300" r="3" fill="#86efac" fill-opacity="0.1"/>
  <circle cx="150" cy="350" r="2" fill="#86efac" fill-opacity="0.12"/>
  <circle cx="280" cy="50" r="2.5" fill="#86efac" fill-opacity="0.1"/>
</svg>