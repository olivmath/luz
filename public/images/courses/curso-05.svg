<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d1a"/>
      <stop offset="100%" stop-color="#0a1f0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a1f0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Blockchain chain -->
  <g transform="translate(40, 160)" opacity="0.25">
    <rect x="0" y="0" width="55" height="35" rx="4" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="8" y1="12" x2="47" y2="12" stroke="#4ade80" stroke-width="0.6"/>
    <line x1="8" y1="20" x2="35" y2="20" stroke="#4ade80" stroke-width="0.6"/>
    <line x1="55" y1="17" x2="75" y2="17" stroke="#4ade80" stroke-width="1"/>
    <rect x="75" y="0" width="55" height="35" rx="4" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="83" y1="12" x2="122" y2="12" stroke="#4ade80" stroke-width="0.6"/>
    <line x1="83" y1="20" x2="110" y2="20" stroke="#4ade80" stroke-width="0.6"/>
    <line x1="130" y1="17" x2="150" y2="17" stroke="#4ade80" stroke-width="1"/>
    <rect x="150" y="0" width="55" height="35" rx="4" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="158" y1="12" x2="197" y2="12" stroke="#4ade80" stroke-width="0.6"/>
    <line x1="158" y1="20" x2="185" y2="20" stroke="#4ade80" stroke-width="0.6"/>
  </g>

  <!-- Token (ERC-20 coin) -->
  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="24" fill="#22c55e" fill-opacity="0.05"/>
    <text x="0" y="2" font-family="monospace" font-size="10" fill="#4ade80" fill-opacity="0.35" text-anchor="middle">ERC</text>
    <text x="0" y="14" font-family="monospace" font-size="10" fill="#4ade80" fill-opacity="0.35" text-anchor="middle">20</text>
  </g>

  <!-- NFT token (ERC-721) -->
  <g transform="translate(80, 70)" opacity="0.2">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="6" y="6" width="28" height="20" rx="2" fill="#fbbf24" fill-opacity="0.1"/>
    <text x="20" y="40" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">NFT</text>
  </g>

  <!-- Smart contract icon -->
  <g transform="translate(270, 240)" opacity="0.2">
    <rect x="0" y="0" width="80" height="90" rx="6" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <text x="40" y="18" font-family="monospace" font-size="8" fill="#86efac" text-anchor="middle">contract</text>
    <line x1="10" y1="24" x2="70" y2="24" stroke="#86efac" stroke-width="0.5"/>
    <text x="15" y="38" font-family="monospace" font-size="7" fill="#86efac" opacity="0.6">mint()</text>
    <text x="15" y="50" font-family="monospace" font-size="7" fill="#86efac" opacity="0.6">burn()</text>
    <text x="15" y="62" font-family="monospace" font-size="7" fill="#86efac" opacity="0.6">transfer()</text>
    <line x1="10" y1="68" x2="70" y2="68" stroke="#86efac" stroke-width="0.5"/>
    <text x="15" y="82" font-family="monospace" font-size="7" fill="#86efac" opacity="0.5">CPR token</text>
  </g>

  <!-- Wheat + token bridge (agro meets web3) -->
  <g transform="translate(50, 260)" opacity="0.15">
    <line x1="30" y1="0" x2="30" y2="90" stroke="#86efac" stroke-width="1.5"/>
    <ellipse cx="23" cy="10" rx="4" ry="11" fill="#86efac" transform="rotate(-22,23,10)"/>
    <ellipse cx="37" cy="25" rx="4" ry="11" fill="#86efac" transform="rotate(22,37,25)"/>
    <ellipse cx="23" cy="40" rx="4" ry="11" fill="#86efac" transform="rotate(-22,23,40)"/>
    <ellipse cx="37" cy="55" rx="4" ry="11" fill="#86efac" transform="rotate(22,37,55)"/>
    <line x1="55" y1="45" x2="85" y2="45" stroke="#86efac" stroke-width="1"/>
    <line x1="80" y1="41" x2="85" y2="45" stroke="#86efac" stroke-width="1"/>
    <line x1="80" y1="49" x2="85" y2="45" stroke="#86efac" stroke-width="1"/>
    <circle cx="105" cy="45" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="105" y="49" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">T</text>
  </g>

  <!-- Oracle icon -->
  <g transform="translate(180, 60)" opacity="0.15">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <ellipse cx="20" cy="20" rx="10" ry="6" fill="none" stroke="#86efac" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#86efac" fill-opacity="0.3"/>
    <line x1="0" y1="0" x2="8" y2="10" stroke="#86efac" stroke-width="0.6"/>
    <line x1="40" y1="0" x2="32" y2="10" stroke="#86efac" stroke-width="0.6"/>
  </g>

  <!-- Network nodes -->
  <g opacity="0.08">
    <circle cx="160" cy="300" r="4" fill="#4ade80"/>
    <circle cx="220" cy="340" r="4" fill="#4ade80"/>
    <circle cx="180" cy="370" r="4" fill="#4ade80"/>
    <line x1="160" y1="300" x2="220" y2="340" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="220" y1="340" x2="180" y2="370" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="160" y1="300" x2="180" y2="370" stroke="#4ade80" stroke-width="0.8"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#4ade80" fill-opacity="0.15"/>
  <circle cx="30" cy="30" r="1.5" fill="#86efac" fill-opacity="0.1"/>
  <circle cx="350" cy="380" r="2" fill="#4ade80" fill-opacity="0.1"/>
</svg>