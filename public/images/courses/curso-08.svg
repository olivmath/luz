<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f0520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- DID Document structure -->
  <g transform="translate(100, 50)" opacity="0.25">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="100" y="20" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">DID Document</text>
    <line x1="10" y1="28" x2="190" y2="28" stroke="#c084fc" stroke-width="0.5"/>
    <text x="15" y="44" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">@context: [...]</text>
    <text x="15" y="58" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">id: "did:ethr:0x..."</text>
    <text x="15" y="72" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">verificationMethod:</text>
    <text x="25" y="84" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.4">  type: Ed25519</text>
    <text x="15" y="100" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">authentication: [...]</text>
    <text x="15" y="114" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">service: [...]</text>
    <text x="15" y="128" font-family="monospace" font-size="7" fill="#e9d5ff" opacity="0.6">keyAgreement: [...]</text>
  </g>

  <!-- Cryptographic curves -->
  <g transform="translate(40, 250)" opacity="0.2">
    <ellipse cx="60" cy="40" rx="55" ry="35" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="35" cy="28" r="3" fill="#c084fc" fill-opacity="0.3"/>
    <circle cx="85" cy="52" r="3" fill="#c084fc" fill-opacity="0.3"/>
    <circle cx="60" cy="15" r="2" fill="#c084fc" fill-opacity="0.3"/>
    <text x="60" y="90" font-family="monospace" font-size="7" fill="#c084fc" fill-opacity="0.5" text-anchor="middle">Ed25519</text>
  </g>

  <!-- ZKP shield -->
  <g transform="translate(280, 220)" opacity="0.2">
    <path d="M30,0 L60,15 L60,45 Q60,65 30,75 Q0,65 0,45 L0,15Z" fill="#a855f7" fill-opacity="0.05" stroke="#c084fc" stroke-width="1.5"/>
    <text x="30" y="35" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">ZK</text>
    <text x="30" y="50" font-family="monospace" font-size="7" fill="#c084fc" fill-opacity="0.6" text-anchor="middle">Proof</text>
  </g>

  <!-- Resolver arrows -->
  <g transform="translate(200, 320)" opacity="0.15">
    <rect x="-60" y="0" width="120" height="25" rx="4" fill="none" stroke="#e9d5ff" stroke-width="1"/>
    <text x="0" y="16" font-family="monospace" font-size="8" fill="#e9d5ff" text-anchor="middle">Universal Resolver</text>
    <line x1="-80" y1="12" x2="-62" y2="12" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="-66" y1="8" x2="-62" y2="12" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="-66" y1="16" x2="-62" y2="12" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="62" y1="12" x2="80" y2="12" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="76" y1="8" x2="80" y2="12" stroke="#e9d5ff" stroke-width="1"/>
    <line x1="76" y1="16" x2="80" y2="12" stroke="#e9d5ff" stroke-width="1"/>
  </g>

  <!-- Lock/security icon -->
  <g transform="translate(320, 60)" opacity="0.15">
    <rect x="0" y="15" width="30" height="22" rx="3" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M6,15 L6,8 Q6,0 15,0 Q24,0 24,8 L24,15" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="15" cy="26" r="3" fill="#a855f7" fill-opacity="0.2"/>
  </g>

  <!-- Network mesh -->
  <g opacity="0.06">
    <circle cx="50" cy="170" r="3" fill="#a855f7"/>
    <circle cx="350" cy="170" r="3" fill="#a855f7"/>
    <circle cx="370" cy="380" r="3" fill="#c084fc"/>
    <circle cx="30" cy="370" r="2" fill="#c084fc"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#a855f7" fill-opacity="0.15"/>
  <circle cx="30" cy="30" r="1.5" fill="#c084fc" fill-opacity="0.1"/>
</svg>
