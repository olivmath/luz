<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e14"/>
      <stop offset="100%" stop-color="#060e0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060e0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060e0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <rect width="400" height="400" fill="url(#glow2)"/>

  <!-- ERC-3643 compliance token (main element) -->
  <g transform="translate(170, 120)">
    <polygon points="30,0 55,15 55,45 30,60 5,45 5,15" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.3"/>
    <polygon points="30,8 49,20 49,40 30,52 11,40 11,20" fill="#22c55e" fill-opacity="0.06"/>
    <rect x="22" y="28" width="16" height="12" rx="2" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M25,28 L25,23 A5,5 0 0,1 35,23 L35,28" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
    <text x="30" y="75" font-family="monospace" font-size="7" fill="#4ade80" fill-opacity="0.25" text-anchor="middle">ERC-3643</text>
  </g>

  <!-- Vault (ERC-4626) -->
  <g transform="translate(50, 60)" opacity="0.2">
    <rect x="0" y="0" width="70" height="55" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="5" y="5" width="60" height="10" rx="2" fill="#fbbf24" fill-opacity="0.1"/>
    <text x="35" y="13" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">VAULT</text>
    <rect x="15" y="22" width="40" height="4" rx="2" fill="#fbbf24" fill-opacity="0.2"/>
    <rect x="18" y="28" width="34" height="4" rx="2" fill="#fbbf24" fill-opacity="0.15"/>
    <rect x="21" y="34" width="28" height="4" rx="2" fill="#fbbf24" fill-opacity="0.1"/>
    <text x="35" y="48" font-family="monospace" font-size="6" fill="#fbbf24" text-anchor="middle" opacity="0.6">4626</text>
  </g>

  <!-- Waterfall structure -->
  <g transform="translate(280, 50)" opacity="0.18">
    <rect x="0" y="0" width="80" height="18" rx="3" fill="none" stroke="#86efac" stroke-width="1"/>
    <text x="40" y="13" font-family="monospace" font-size="7" fill="#86efac" text-anchor="middle">SENIOR</text>
    <line x1="40" y1="18" x2="40" y2="26" stroke="#86efac" stroke-width="0.8"/>
    <line x1="37" y1="23" x2="40" y2="26" stroke="#86efac" stroke-width="0.8"/>
    <line x1="43" y1="23" x2="40" y2="26" stroke="#86efac" stroke-width="0.8"/>
    <rect x="5" y="28" width="70" height="18" rx="3" fill="none" stroke="#4ade80" stroke-width="1"/>
    <text x="40" y="40" font-family="monospace" font-size="7" fill="#4ade80" text-anchor="middle">MEZZ</text>
    <line x1="40" y1="46" x2="40" y2="54" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="37" y1="51" x2="40" y2="54" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="43" y1="51" x2="40" y2="54" stroke="#4ade80" stroke-width="0.8"/>
    <rect x="10" y="56" width="60" height="18" rx="3" fill="none" stroke="#d97706" stroke-width="1"/>
    <text x="40" y="68" font-family="monospace" font-size="7" fill="#d97706" text-anchor="middle">EQUITY</text>
  </g>

  <!-- DeFi flow (liquidity pools) -->
  <g transform="translate(40, 220)" opacity="0.15">
    <circle cx="30" cy="30" r="25" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="15" fill="#86efac" fill-opacity="0.05"/>
    <text x="30" y="34" font-family="monospace" font-size="8" fill="#86efac" text-anchor="middle">LP</text>
    <circle cx="55" cy="35" r="20" fill="none" stroke="#4ade80" stroke-width="1"/>
    <line x1="80" y1="30" x2="110" y2="30" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="105" y1="27" x2="110" y2="30" stroke="#4ade80" stroke-width="0.8"/>
    <line x1="105" y1="33" x2="110" y2="30" stroke="#4ade80" stroke-width="0.8"/>
    <text x="130" y="34" font-family="monospace" font-size="8" fill="#86efac" opacity="0.5">YIELD</text>
  </g>

  <!-- Governance DAO icon -->
  <g transform="translate(260, 220)" opacity="0.15">
    <circle cx="40" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="10" cy="40" r="10" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="70" cy="40" r="10" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <line x1="35" y1="8" x2="15" y2="32" stroke="#fbbf24" stroke-width="0.8"/>
    <line x1="45" y1="8" x2="65" y2="32" stroke="#fbbf24" stroke-width="0.8"/>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="40" y="60" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">DAO</text>
  </g>

  <!-- KYC/AML whitelist -->
  <g transform="translate(50, 160)" opacity="0.12">
    <rect x="0" y="0" width="50" height="35" rx="4" fill="none" stroke="#86efac" stroke-width="1"/>
    <text x="25" y="14" font-family="monospace" font-size="7" fill="#86efac" text-anchor="middle">KYC</text>
    <line x1="8" y1="20" x2="42" y2="20" stroke="#86efac" stroke-width="0.5"/>
    <polyline points="15,28 20,32 32,22" fill="none" stroke="#86efac" stroke-width="1.2"/>
  </g>

  <!-- DREX / TradFi bridge -->
  <g transform="translate(200, 310)" opacity="0.12">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="40" y="18" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">DREX</text>
    <line x1="10" y1="24" x2="70" y2="24" stroke="#4ade80" stroke-width="0.4"/>
    <text x="40" y="35" font-family="monospace" font-size="6" fill="#4ade80" text-anchor="middle" opacity="0.5">BRIDGE</text>
  </g>

  <!-- Network mesh background -->
  <g stroke="#22c55e" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="50" y1="350" x2="150" y2="380"/>
    <line x1="150" y1="380" x2="100" y2="400"/>
    <line x1="300" y1="370" x2="380" y2="350"/>
    <line x1="350" y1="300" x2="380" y2="350"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#4ade80" fill-opacity="0.12"/>
  <circle cx="20" cy="380" r="2" fill="#fbbf24" fill-opacity="0.1"/>
  <circle cx="370" cy="200" r="1.5" fill="#86efac" fill-opacity="0.08"/>
</svg>