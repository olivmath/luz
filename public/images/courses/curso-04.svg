<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e4d"/>
      <stop offset="100%" stop-color="#061030"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#061030" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Liposome (main nanovector) - large cross-section -->
  <g transform="translate(180, 170)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="35" fill="#3b82f6" fill-opacity="0.06"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>
    <!-- Encapsulated active (payload) -->
    <circle cx="-8" cy="-5" r="6" fill="#fbbf24" fill-opacity="0.2"/>
    <circle cx="10" cy="8" r="5" fill="#fbbf24" fill-opacity="0.15"/>
    <circle cx="-3" cy="12" r="4" fill="#fbbf24" fill-opacity="0.12"/>
    <!-- Head groups on outer membrane -->
    <g fill="#7dd3fc" fill-opacity="0.2">
      <circle cx="0" cy="-70" r="3"/>
      <circle cx="20" cy="-68" r="3"/>
      <circle cx="-20" cy="-68" r="3"/>
      <circle cx="40" cy="-60" r="3"/>
      <circle cx="-40" cy="-60" r="3"/>
      <circle cx="55" cy="-45" r="3"/>
      <circle cx="-55" cy="-45" r="3"/>
      <circle cx="65" cy="-25" r="3"/>
      <circle cx="-65" cy="-25" r="3"/>
      <circle cx="70" cy="0" r="3"/>
      <circle cx="-70" cy="0" r="3"/>
      <circle cx="65" cy="25" r="3"/>
      <circle cx="-65" cy="25" r="3"/>
      <circle cx="55" cy="45" r="3"/>
      <circle cx="-55" cy="45" r="3"/>
      <circle cx="40" cy="60" r="3"/>
      <circle cx="-40" cy="60" r="3"/>
      <circle cx="20" cy="68" r="3"/>
      <circle cx="-20" cy="68" r="3"/>
      <circle cx="0" cy="70" r="3"/>
    </g>
  </g>

  <!-- Nanocapsule (smaller, right side) -->
  <g transform="translate(320, 90)" opacity="0.2">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="0" cy="0" r="10" fill="#60a5fa" fill-opacity="0.1"/>
    <circle cx="-3" cy="2" r="3" fill="#fbbf24" fill-opacity="0.3"/>
  </g>

  <!-- Polymer chain decoration -->
  <g transform="translate(40, 100)" opacity="0.15" stroke="#93c5fd" stroke-width="1.2" fill="none">
    <path d="M0,0 Q15,-15 30,0 Q45,15 60,0 Q75,-15 90,0"/>
    <circle cx="0" cy="0" r="3" fill="#93c5fd"/>
    <circle cx="30" cy="0" r="3" fill="#93c5fd"/>
    <circle cx="60" cy="0" r="3" fill="#93c5fd"/>
    <circle cx="90" cy="0" r="3" fill="#93c5fd"/>
  </g>

  <!-- Encapsulation process arrows -->
  <g transform="translate(50, 290)" opacity="0.15">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#fbbf24" fill-opacity="0.2"/>
    <line x1="18" y1="0" x2="45" y2="0" stroke="#93c5fd" stroke-width="1"/>
    <line x1="40" y1="-4" x2="45" y2="0" stroke="#93c5fd" stroke-width="1"/>
    <line x1="40" y1="4" x2="45" y2="0" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="65" cy="0" r="15" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="65" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="65" cy="0" r="4" fill="#fbbf24" fill-opacity="0.2"/>
  </g>

  <!-- DLS measurement graph (characterization) -->
  <g transform="translate(250, 300)" opacity="0.12">
    <line x1="0" y1="60" x2="120" y2="60" stroke="#93c5fd" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#93c5fd" stroke-width="1"/>
    <path d="M10,58 Q30,55 50,20 Q65,0 80,20 Q100,55 110,58" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="75" font-family="sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">nm</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="370" r="2" fill="#38bdf8" fill-opacity="0.15"/>
  <circle cx="30" cy="370" r="2" fill="#93c5fd" fill-opacity="0.1"/>
  <circle cx="350" cy="200" r="1.5" fill="#7dd3fc" fill-opacity="0.1"/>
</svg>