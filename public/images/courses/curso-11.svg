<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f0520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Large shield (security) -->
  <g transform="translate(200, 180)" opacity="0.25">
    <path d="M0,-80 L65,-55 L65,15 Q65,60 0,80 Q-65,60 -65,15 L-65,-55Z" fill="#a855f7" fill-opacity="0.04" stroke="#c084fc" stroke-width="2"/>
    <!-- Checkmark inside shield -->
    <path d="M-18,5 L-5,18 L22,-10" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Interoperability bridges -->
  <g transform="translate(55, 60)" opacity="0.2">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="30" y="19" font-family="monospace" font-size="7" fill="#e9d5ff" text-anchor="middle">did:web</text>
  </g>
  <g transform="translate(170, 40)" opacity="0.2">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="30" y="19" font-family="monospace" font-size="7" fill="#e9d5ff" text-anchor="middle">did:key</text>
  </g>
  <g transform="translate(285, 60)" opacity="0.2">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="30" y="19" font-family="monospace" font-size="7" fill="#e9d5ff" text-anchor="middle">did:ethr</text>
  </g>

  <!-- Bridge lines between methods -->
  <g opacity="0.12">
    <line x1="115" y1="75" x2="170" y2="55" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="230" y1="55" x2="285" y2="75" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="115" y1="75" x2="285" y2="75" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- Threat model: attack vectors -->
  <g transform="translate(50, 290)" opacity="0.15">
    <path d="M25,0 L50,43 L0,43Z" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="25" y="28" font-family="monospace" font-size="12" fill="#c084fc" text-anchor="middle">!</text>
    <text x="25" y="58" font-family="monospace" font-size="6" fill="#c084fc" fill-opacity="0.7" text-anchor="middle">Threats</text>
  </g>

  <!-- Governance framework -->
  <g transform="translate(280, 280)" opacity="0.15">
    <rect x="0" y="0" width="70" height="55" rx="5" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="35" y="18" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Trust</text>
    <text x="35" y="30" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">Framework</text>
    <line x1="10" y1="38" x2="60" y2="38" stroke="#c084fc" stroke-width="0.5"/>
    <text x="35" y="50" font-family="monospace" font-size="6" fill="#e9d5ff" fill-opacity="0.5" text-anchor="middle">Governance</text>
  </g>

  <!-- Integration arrows (circular flow) -->
  <g transform="translate(200, 340)" opacity="0.15">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Circular arrows -->
    <path d="M0,-25 A25,25 0 0,1 22,12" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <path d="M19,15 L22,12 L25,16" fill="none" stroke="#e9d5ff" stroke-width="1"/>
    <path d="M22,12 A25,25 0 0,1 -22,12" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <path d="M-19,15 L-22,12 L-25,16" fill="none" stroke="#e9d5ff" stroke-width="1"/>
    <text x="0" y="4" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle">CI/CD</text>
  </g>

  <!-- Lock with rotation key -->
  <g transform="translate(320, 160)" opacity="0.18">
    <rect x="0" y="20" width="40" height="30" rx="4" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M8,20 L8,12 Q8,0 20,0 Q32,0 32,12 L32,20" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="20" cy="35" r="4" fill="#a855f7" fill-opacity="0.2"/>
    <line x1="20" y1="39" x2="20" y2="44" stroke="#c084fc" stroke-width="1"/>
    <!-- Rotation arrow -->
    <path d="M42,10 A15,15 0 1,0 42,30" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.5"/>
    <path d="M40,28 L42,30 L44,27" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Network mesh -->
  <g opacity="0.06">
    <circle cx="50" cy="180" r="3" fill="#a855f7"/>
    <circle cx="350" cy="130" r="3" fill="#a855f7"/>
    <circle cx="370" cy="380" r="3" fill="#c084fc"/>
    <circle cx="30" cy="370" r="2" fill="#c084fc"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="2" fill="#a855f7" fill-opacity="0.15"/>
  <circle cx="30" cy="30" r="1.5" fill="#c084fc" fill-opacity="0.1"/>
</svg>
